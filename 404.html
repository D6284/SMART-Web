<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | SMART TECH</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #071426;
            color: #f5f7fb;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }

        .card {
            max-width: 520px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 32px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 16px;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 24px;
        }

        a {
            display: inline-block;
            background: #4f46e5;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>404</h1>
        <p>The page you’re looking for could not be found.</p>
        <a href="/">Return Home</a>
    </div>
</body>

</html>
